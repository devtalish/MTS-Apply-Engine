name: Talish Engine Validation

on:
  push:
    branches: [talish-autopilot-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Test
        run: pytest tests/ -v
      - name: CLI smoke test
        run: |
          applypilot --help
          applypilot apply --help
          applypilot interview-prep --help
