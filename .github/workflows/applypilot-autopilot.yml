name: ApplyPilot Autopilot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ApplyPilot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check ApplyPilot
        run: |
          applypilot --help
          applypilot apply --help

      - name: Check configuration
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          RESUME_TXT: ${{ secrets.RESUME_TXT }}
        run: |
          mkdir -p "$HOME/.applypilot"

          printf '%s' "$PROFILE_JSON" > "$HOME/.applypilot/profile.json"
          printf '%s' "$RESUME_TXT" > "$HOME/.applypilot/resume.txt"

          test -s "$HOME/.applypilot/profile.json"
          test -s "$HOME/.applypilot/resume.txt"

          echo "Profile loaded."
          echo "Resume loaded."
