name: Talish Job Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,11,19 * * *"

concurrency:
  group: talish-job-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-score-tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLYPILOT_DIR: ${{ runner.temp }}/.applypilot
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_URL: https://openrouter.ai/api/v1
      LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_MODEL: openrouter/free
      LLM_MODEL_QUALITY: openrouter/free
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      RESUME_TXT: ${{ secrets.RESUME_TXT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore engine state
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.applypilot/applypilot.db
            ${{ runner.temp }}/.applypilot/tailored_resumes
            ${{ runner.temp }}/.applypilot/cover_letters
            ${{ runner.temp }}/.applypilot/tracking
            ${{ runner.temp }}/.applypilot/logs
          key: talish-engine-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            talish-engine-${{ runner.os }}-${{ github.ref_name }}-
            talish-engine-${{ runner.os }}-main-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Load private candidate inputs
        run: |
          mkdir -p "$APPLYPILOT_DIR"
          printf '%s' "$PROFILE_JSON" > "$APPLYPILOT_DIR/profile.json"
          printf '%s' "$RESUME_TXT" > "$APPLYPILOT_DIR/resume.txt"
          test -s "$APPLYPILOT_DIR/profile.json"
          test -s "$APPLYPILOT_DIR/resume.txt"

      - name: Initialize
        run: |
          applypilot --help
          applypilot status

      - name: Discover, enrich, score, tailor and cover
        run: |
          applypilot run all --workers 2 --min-score 8 --max-age-days 7 --limit 20

      - name: Validate engine state
        run: |
          applypilot status

