name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Policy and LLM regression tests
        run: pytest -q tests/test_scorer_prefilter.py tests/test_llm_cascade.py
      - name: CLI smoke
        run: python -m applypilot.cli --help

# Focused validation for Talish hardening; legacy repository lint/test debt is excluded.