# Remote-first search configuration for Muhammad Talish.
# Primary target: legitimate technical recurring work, 5-14 hours/week.
# Secondary target: flexible work up to 20 hours/week.
# Full-time 30-40 hour roles are intentionally excluded downstream.

queries:
  - query: "part time software developer"
    tier: 1
  - query: "part time full stack developer"
    tier: 1
  - query: "part time backend developer"
    tier: 1
  - query: "part time Python developer"
    tier: 1
  - query: "part time AI engineer"
    tier: 1
  - query: "part time automation engineer"
    tier: 1
  - query: "part time API integration developer"
    tier: 1
  - query: "contract software developer"
    tier: 1
  - query: "async software engineer"
    tier: 1
  - query: "flexible software developer"
    tier: 1
  - query: "freelance software developer"
    tier: 2
  - query: "contract Python developer"
    tier: 2
  - query: "contract full stack developer"
    tier: 2
  - query: "AI automation developer"
    tier: 2
  - query: "technical implementation engineer"
    tier: 2
  - query: "QA automation engineer"
    tier: 2

locations:
  - location: "Remote"
    remote: true

location:
  primary: "Pakistan"
  accept_patterns:
    - "Remote"
    - "Worldwide"
    - "Global"
    - "Work from anywhere"
    - "Pakistan"
  reject_patterns:
    - "US only"
    - "USA only"
    - "Canada only"
    - "UK only"
    - "Europe only"
    - "EU only"
    - "India only"
    - "onsite only"

country: "WORLDWIDE"
country_indeed: "worldwide"

# Discovery boards are sources, not application endpoints.
boards:
  - linkedin
  - indeed

defaults:
  results_per_site: 75
  hours_old: 72
  country_indeed: "worldwide"

exclude_titles:
  - "senior"
  - "staff"
  - "principal"
  - "lead"
  - "head"
  - "director"
  - "vice president"
  - "chief"
  - "cto"
  - "intern"
  - "internship"
  - "co-op"
  - "commission only"
  - "commission-only"
  - "unpaid"
